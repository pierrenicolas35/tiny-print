name: Déploiement PR Preview

on:
  workflow_call:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - closed

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pr-preview:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy Preview to GitHub Pages
        uses: rossjrw/pr-preview-action@v1
        with:
          source-dir: .
          umbrella-dir: pr-preview
          action: auto
